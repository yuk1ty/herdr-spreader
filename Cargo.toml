[package]
name = "herdr-spreader"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Apply tmuxinator-style project layouts to herdr from a YAML file"
repository = "https://github.com/yuk1ty/herdr-spreader"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.150"
thiserror = "2.0.18"
anyhow = "1.0.103"
libc = "0.2.186"

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
assert_cmd = "2.2.2"
